    fm.position.z = 0.07; fm.renderOrder = 1;
    var bm = new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28), buildMat(null, true));
    bm.position.z = -0.07; bm.rotation.y = Math.PI; bm.renderOrder = 0;
    group.add(fm, bm);

  } else if (mode === 'frontOnly') {
    var fm2 = new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28), buildMat(fTex, false));
    fm2.position.z = 0.07; fm2.renderOrder = 1;
    group.add(fm2);

  } else if (mode === 'backOnly') {
    // Back mesh only, rotated so front face is toward camera
    var bm2 = new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28), buildMat(bTex, true));
    bm2.position.z = 0.07; bm2.rotation.y = Math.PI; bm2.renderOrder = 0;
    group.add(bm2);

  } else if (mode === 'backThrough') {
    // ONLY back mesh at default position — tests whether back mesh is visible "through" front's transparent areas
    var fm3 = new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28), buildMat(fTex, false));
    fm3.position.z = 0.07; fm3.renderOrder = 1;
    group.add(fm3);
    // No back mesh — see what front looks like alone with transparent neckhole showing pure scene bg
    // Actually for "backThrough" let's add the back mesh WITHOUT texture, just opaque
    var bm3 = new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28), new THREE.MeshBasicMaterial({color:0xff0000, side:THREE.FrontSide}));
    bm3.position.z = -0.07; bm3.rotation.y = Math.PI; bm3.renderOrder = 0;
    group.add(bm3);

  } else {
    // both — normal full render
    var fm4 = new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28), buildMat(fTex, false));
    fm4.position.z = 0.07; fm4.renderOrder = 1;
    var bm4 = new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28), buildMat(bTex, true));
    bm4.position.z = -0.07; bm4.rotation.y = Math.PI; bm4.renderOrder = 0;
    group.add(fm4, bm4);
  }
}

var t0 = Date.now();
function animate() {
  requestAnimationFrame(animate);
  var t = (Date.now()-t0)*0.001;
  group.children.forEach(function(m) {
    if (m.material && m.material.userData && m.material.userData.shader) {
      if (m.material.userData.shader.uniforms.u_time) m.material.userData.shader.uniforms.u_time.value = t;
    }
  });
  // Slow rotation so we can see the 3D shape
  group.rotation.y = t * 0.4;
  renderer.render(scene, camera);
}
animate();

// Load textures, then init
if (mode === 'solid') {
  init(null, null);
} else {
  var loaded = 0, fT=null, bT=null;
  function check() { if (++loaded>=2) init(fT,bT); }
  loadSvgTex(FRONT_URI, false, function(t){fT=t; check();});
  loadSvgTex(BACK_URI, true, function(t){bT=t; check();});
}
</script></body></html>
