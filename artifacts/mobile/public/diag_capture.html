  var div=document.createElement('div');div.className='cell';
  var h=document.createElement('div');h.style.cssText='font-size:10px;color:#C9A96E;margin-bottom:3px;';h.textContent=label;
  var img=document.createElement('img');img.src=dataUrl;
  div.appendChild(h);div.appendChild(img);
  document.getElementById('results').appendChild(div);
}

        'float normY = clamp((position.y + 1.4) / 2.8, 0.0, 1.0);',
        'float hem = normY * normY;',
        /* FIXED VERSION — avoids pow() with potentially negative base */
        'float pnx = position.x / 1.1;',
        'float cv = 1.0 - pnx * pnx;',
        'transformed.z += cv * u_curve;',
        'transformed.z += sin(u_time * u_speed + position.x * u_freq) * u_amp * hem;',
        'transformed.x += cos(u_time * u_speed * 0.6 + position.y * u_freq * 0.7) * u_amp * 0.3 * hem;'
      ].join('
'));
      mat.userData.shader=sh;
      matShaders.push(sh);
    };
    return mat;
  }

  var group=new THREE.Group();
  scene.add(group);

  var isFixed = mode.indexOf('FIXED')!==-1;
  var baseMode = mode.replace('_FIXED','');
  var MB = isFixed ? buildMatFixed : buildMat;

  if(baseMode==='solid'){
    var fm=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28),MB(null,false));
    fm.position.z=0.07;fm.renderOrder=1;
    var bm=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28),MB(null,true));
    bm.position.z=-0.07;bm.rotation.y=Math.PI;bm.renderOrder=0;
    group.add(fm,bm);
  } else if(baseMode==='frontOnly'){
    var fm2=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28),MB(fTex,false));
    fm2.position.z=0.07;fm2.renderOrder=1;
    group.add(fm2);
  } else if(baseMode==='backOnly'){
    var bm2=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28),MB(bTex,true));
    bm2.position.z=0.07;bm2.rotation.y=Math.PI;
    group.add(bm2);
  } else {
    var fm3=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28),MB(fTex,false));
    fm3.position.z=0.07;fm3.renderOrder=1;
    var bm3=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8,28,28),MB(bTex,true));
    bm3.position.z=-0.07;bm3.rotation.y=Math.PI;bm3.renderOrder=0;
    group.add(fm3,bm3);
  }

  group.rotation.y = 0.08; // slight angle to see 3D

  // Render multiple frames to let shaders compile
  var frames=0;
  function doRender(){
    frames++;
    matShaders.forEach(function(sh){if(sh.uniforms.u_time)sh.uniforms.u_time.value=0.5;});
    ren.render(scene,cam);
    if(frames<6){
      requestAnimationFrame(doRender);
    } else {
      var url=cv.toDataURL('image/png');
      ren.dispose();
      callback(url, null);
    }
  }
  requestAnimationFrame(doRender);
}

function loadSvgTex(uri,isBack,done){
  var b64=uri.split(',')[1];
  var binary=atob(b64);var bytes=new Uint8Array(binary.length);
  for(var k=0;k<binary.length;k++)bytes[k]=binary.charCodeAt(k);
  var blob=new Blob([bytes],{type:'image/svg+xml'});
  var blobUrl=URL.createObjectURL(blob);
  var img=new Image();
  img.onload=function(){
    var sz=1024;var svgW=img.naturalWidth||400;var svgH=img.naturalHeight||520;
    var scale=sz/Math.max(svgW,svgH);
    var dW=Math.round(svgW*scale),dH=Math.round(svgH*scale);
    var oX=Math.round((sz-dW)/2),oY=Math.round((sz-dH)/2);
    var cnv=document.createElement('canvas');cnv.width=cnv.height=sz;
    cnv.getContext('2d').drawImage(img,oX,oY,dW,dH);
    URL.revokeObjectURL(blobUrl);
    var tex=new THREE.CanvasTexture(cnv);tex.needsUpdate=true;
    if(THREE.sRGBEncoding!==undefined)tex.encoding=THREE.sRGBEncoding;
    if(isBack){tex.repeat.set(-1,1);tex.offset.set(1,0);}
    done(tex);
  };
  img.onerror=function(){URL.revokeObjectURL(blobUrl);done(null);};
  img.src=blobUrl;
}

setStatus('Loading SVG textures...');
var fTex=null,bTex=null,loaded=0;
function onLoaded(){
  if(++loaded<2)return;
  setStatus('Rendering test scenes...');
  
  var modes=[
    ['solid (no texture, BUGGY pow)',    'solid'],
    ['solid (no texture, FIXED pow)',    'solid_FIXED'],
    ['front mesh only (BUGGY pow)',      'frontOnly'],
    ['front mesh only (FIXED pow)',      'frontOnly_FIXED'],
    ['back mesh only (BUGGY pow)',       'backOnly'],
    ['back mesh only (FIXED pow)',       'backOnly_FIXED'],
    ['both meshes (BUGGY pow)',          'both'],
    ['both meshes (FIXED pow)',          'both_FIXED'],
  ];
  
  var i=0;
  function next(){
    if(i>=modes.length){setStatus('Done — compare BUGGY vs FIXED columns');return;}
    var m=modes[i++];
    render3D(m[1], fTex, bTex, function(url, err){
      if(url) addResult(m[0], url);
      else addResult(m[0]+' ERROR', 'data:,'+encodeURIComponent(err||''));
      next();
    });
  }
  next();
}
loadSvgTex(FRONT_URI,false,function(t){fTex=t;onLoaded();});
loadSvgTex(BACK_URI,true,function(t){bTex=t;onLoaded();});
</script></body></html>
